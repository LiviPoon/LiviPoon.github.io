name: Update Garmin lifetime step count

on:
  schedule:
    - cron: "0 4 * * 1"   # Every Monday at 04:00 UTC
  workflow_dispatch:        # Manual trigger from the Actions tab

permissions:
  contents: write           # Needed to push the updated index.md

jobs:
  update-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached Garmin session
        uses: actions/cache@v4
        with:
          path: garmin_session.json
          # New cache entry per run, but always falls back to most recent existing one
          key: garmin-session-${{ github.run_id }}
          restore-keys: garmin-session-

      - name: Install dependencies
        run: pip install garminconnect beautifulsoup4 python-dotenv

      - name: Fetch steps and update index.md
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python garmin_steps.py --file livipoon-quartz4/content/index.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add livipoon-quartz4/content/index.md lifetime_steps.json
          git diff --staged --quiet && echo "No changes to commit." || (
            git commit -m "chore: update lifetime step count [skip ci]" &&
            git push
          )
